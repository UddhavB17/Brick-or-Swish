[project]
name = "third-umpire"
version = "0.1.0"
description = "Puts a Flagsmith A/B result on review before anyone ships the winner."
requires-python = ">=3.10"
dependencies = ["rich>=13.7", "tiktoken>=0.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
third-umpire = "third_umpire.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["third_umpire*"]

[tool.setuptools.package-data]
third_umpire = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/build_fixtures.py" = ["E501"]
